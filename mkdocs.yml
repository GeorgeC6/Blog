site_name: G-log
site_author: George Cao
site_url: https://blog.gorco.me/
site_description: George's Blog -> G-log

copyright: Copyright &copy; 2024 - 2026 <a href="https://github.com/GeorgeC6" target="_blank" rel="noopener noreferrer">George Cao</a>

theme:
  name: material
  variant: modern
  language: zh
  favicon: images/favicon.ico
  icon:
    logo: George Sig.
    repo: fontawesome/brands/github
    tag:
      thesis: material/file-document
      physics: material/atom
      math: material/function-variant
      code: fontawesome/solid/code
      mkdocs: simple/materialformkdocs
  custom_dir: overrides
  features:
    # - header.autohide # 向下滚动时自动隐藏header
    - navigation.tracking # 地址栏中的 URL 会随当前位置变化为对应小节的 URL
    # - navigation.tabs
    - navigation.top
    # navigation.indexes is incompatible with toc.integrate in Zensical.
    - navigation.footer # 底部导航栏
    - navigation.instant # 站内瞬移；MathJax 由 mathjax.js 在每次导航后重新排版
    - navigation.instant.progress
    - navigation.sections
    - toc.integrate   # 文档 toc 集成到总目录中
    - toc.follow  # 右侧目录跟随滚动
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - content.footnote.tooltips # 鼠标悬停在脚注上时显示脚注内容
    - announce.dismiss

  palette:
    - media: "(prefers-color-scheme: light)"  # 浅色模式
      scheme: default
      primary: light-blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"   # 深色模式
      scheme: slate
      primary: deep-purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeorgeC6
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@gorcomusic
    - icon: fontawesome/brands/soundcloud
      link: https://soundcloud.com/gorco
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/413263041
    - icon: material/forum-outline
      link: https://www.cc98.org/user/id/733259

  analytics:
    provider: google
    property: G-200PC48K70

  tags:
    课程论文: thesis
    微积分: math
    量子力学: physics
    编程技术: code
    MkDocs: mkdocs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - termynal:
      title: bash
      buttons: macos
      prompt_literal_start:
        - "$"
        - ">"
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.mark:
      smart_mark: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - md_in_html
  - attr_list
  - toc:
      permalink: true
      toc_depth: 4

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true # 好像能加快网页加载速度？!
  - tags
  - meta
  - blog:
      blog_dir: .
      post_date_format: long
  - rss:
      enabled: true
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      comments_path: "#__comments"
  - social:
      cards_layout: default
      cards_layout_options:
        font_family: Noto Sans SC
  - glightbox:
      effect: fade
      auto_caption: true

extra_javascript:
  - javascripts/termynal.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js   # MathJax 3

extra_css:
  - stylesheets/termynal.css
  - stylesheets/extra.css
  - stylesheets/custom.css

